$('.startnineholes').click(function(){
    var targetMemberId = $('.rowmulti .memberid').text().trim();

    if (targetMemberId && !isNaN(targetMemberId)) {
        $.ajax({
            url: "/PRGCdatabase/ajax/check-member-group/",
            type: "GET",
            data: {
                'member_id': parseInt(targetMemberId, 10)
            },
            success: function(response) {
                if (response.status === 'found') {
                    console.log("Success! Member was found.");
                    console.log("Table Number matched: " + response.table_number);
                    console.log("Database Table Name: " + response.table_name);

                    // Example action: Run a specific function based on the matched table number
                    handleTableMatch(response.table_number);
                }
                else if (response.status === 'not_found') {
                    console.log("Member ID is completely missing from all 9 tables.");
                }
            },
            error: function(xhr, status, error) {
                console.error("Database search crashed:", error);
            }
        });
    }
});

// A helper function to keep your success block clean
function handleTableMatch(tableNum) {
   if (tableNum === 1) { window.location.href = "/PRGCdatabase/group1hole1/"}
    if (tableNum === 2) { window.location.href = "/PRGCdatabase/group2hole2/" }
    if (tableNum === 3) { window.location.href = "/PRGCdatabase/group3hole3/" }
    if (tableNum === 4) { window.location.href = "/PRGCdatabase/group4hole4/" }
    if (tableNum === 5) { window.location.href = "/PRGCdatabase/group5hole5/" }
    if (tableNum === 6) { window.location.href = "/PRGCdatabase/group6hole6/" }
    if (tableNum === 7) { window.location.href = "/PRGCdatabase/group7hole7/" }
    if (tableNum === 8) { window.location.href = "/PRGCdatabase/group8hole8/" }
    if (tableNum === 9) { window.location.href = "/PRGCdatabase/group9hole9/" }
    // ... up to tableNum === 9
}
