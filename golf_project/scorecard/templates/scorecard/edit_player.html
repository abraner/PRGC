<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Scoring Member Parameters</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #008000;
            margin: 0;
            padding: 20px;
        }
        .registration-panel {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #B3DEB6;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 { color: #1565c0; margin-top: 0; margin-bottom: 5px; }
        p.subtitle { color: #64748b; margin-top: 0; margin-bottom: 25px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; color: #0f172a; }
        .form-group input:focus { outline: none; border-color: #1565c0; box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.15); }
        .error-text { color: #dc2626; font-size: 0.85rem; margin-top: 4px; }
        .actions-wrapper { margin-top: 30px; display: flex; align-items: center; gap: 15px; }
        .btn-submit { background: #1565c0; color: white; border: none; padding: 12px 24px; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 1rem; transition: background 0.2s; }
        .btn-submit:hover { background: #0d47a1; }
        .btn-cancel { color: #64748b; text-decoration: none; font-size: 0.95rem; font-weight: 500; }
        .btn-cancel:hover { text-decoration: underline; color: #334155; }
    </style>
</head>
<body>

<div class="registration-panel">
    <h2>Edit Profile Fields</h2>
    <p class="subtitle">Modifying profile data for <strong>{{ player.name }}</strong> (ID: {{ player.member_id }})</p>

    <form method="post" novalidate>
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="error-text">
                        {% for error in field.errors %}{{ error }}{% endfor %}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="actions-wrapper">
            <button type="submit" class="btn-submit">
                Save Parameter Updates
            </button>
            <a href="{% url 'scorecard:all_members' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
