<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorekeeper Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #008000; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #B3DEB6; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; box-sizing: border-box; }
        .login-header { background: #1b5e20; color: white; margin: -30px -30px 20px -30px; padding: 20px; text-align: center; border-top-left-radius: 12px; border-top-right-radius: 12px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-login { width: 100%; background: #2e7d32; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .error-msg { color: #d32f2f; font-size: 14px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h2 style="margin: 0; font-size: 20px;">PRGC Scorecard</h2>
        <p style="margin: 5px 0 0 0; font-size: 14px;">Squad Scorekeeper Sign-In</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required autofocus placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required placeholder="Enter password">
        </div>

        {% if form.errors %}
            <div class="error-msg">Invalid username or password.</div>
        {% endif %}

        <button type="submit" class="btn-login">Sign In</button>
    </form>
</div>

</body>
</html>
