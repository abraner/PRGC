<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorekeeper Login</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 28px; background: #008000; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #B3DEB6; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 430px; box-sizing: border-box; }
        .login-header { background: #1b5e20; color: white; margin: -30px -30px 20px -30px; padding: 20px; text-align: center; border-top-left-radius: 12px; border-top-right-radius: 12px; }
        .login-header h2 { margin: 0; font-size: 28px; }
        .login-header p { margin: 5px 0 0 0; font-size: 28px; }
        @media (min-width: 768px) and (max-width: 1400px) and (min-height: 700px) {
            .login-card { padding: 39px; max-width: 455px; border-radius: 16px; }
            .login-header { margin: -39px -39px 26px -39px; padding: 26px; border-top-left-radius: 16px; border-top-right-radius: 16px; }
            .login-header p { margin-top: 7px; }
            .form-group { margin-bottom: 20px; }
            label { margin-bottom: 7px; }
            input[type="text"], input[type="password"] { padding: 13px; border-radius: 8px; }
            .password-wrap input { padding-right: 55px; }
            .password-toggle { right: 8px; width: 42px; height: 42px; }
            .password-toggle svg { width: 29px; height: 29px; }
            .btn-login { padding: 16px; border-radius: 8px; margin-top: 13px; }
            .error-msg { margin-top: 13px; }
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-size: 28px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 28pt; }
        input::placeholder { font-size: 28pt; }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 58px; }
        .password-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: none; background: transparent; color: #1b5e20; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .password-toggle svg { width: 22px; height: 22px; display: block; }
        .btn-login { width: 100%; background: #2e7d32; color: white; border: none; padding: 12px; font-size: 28px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .error-msg { color: #d32f2f; font-size: 28px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h2>PRGC Scorecard</h2>
        <p>Squad Scorekeeper Sign-In</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required autofocus placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <div class="password-wrap">
                <input type="password" name="password" id="id_password" required placeholder="Enter password">
                <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg id="eye-open" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg id="eye-off" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                        <path d="M3 3l18 18"></path>
                        <path d="M10.6 10.6a3 3 0 004.2 4.2"></path>
                        <path d="M9.9 5.2A10.8 10.8 0 0112 5c6.5 0 10 7 10 7a18.4 18.4 0 01-3.2 4.2"></path>
                        <path d="M6.1 6.1C3.8 7.8 2 12 2 12s3.5 7 10 7a10.7 10.7 0 004.2-.8"></path>
                    </svg>
                </button>
            </div>
        </div>

        {% if form.errors %}
            <div class="error-msg">Invalid username or password.</div>
        {% endif %}

        <button type="submit" class="btn-login">Sign In</button>
    </form>
</div>

<script>
document.getElementById("toggle-password").addEventListener("click", function () {
    var field = document.getElementById("id_password");
    var showing = field.type === "text";
    field.type = showing ? "password" : "text";
    this.setAttribute("aria-pressed", showing ? "false" : "true");
    this.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    document.getElementById("eye-open").hidden = !showing;
    document.getElementById("eye-off").hidden = showing;
});
</script>

</body>
</html>
