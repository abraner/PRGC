<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjust Financial Payout Parameters</title>
    <style>
        body { font-family: Arial, sans-serif; background: #008000; padding: 25px; }
        .panel { max-width: 500px; margin: 40px auto; padding: 30px; border-radius: 8px; background: #B3DEB6; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #004d40; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-save { background: #004d40; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-cancel { color: #666; text-decoration: none; margin-left: 15px; }
    </style>
</head>
<body>

<div class="panel">
    <h2>💸 Adjust Men's League Payout Rules</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Modify tournament finance logic. Changes apply live to current active rounds instantly.</p>

    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <div style="margin-top: 30px;">
            <button type="submit" class="btn-save">Save Payout Changes</button>
            <a href="{% url 'scorecard:admin_dashboard' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
