<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manually Build a Squad</title>
    <style>
        body { font-family: Arial, sans-serif; background: #008000; margin: 0; padding: 25px; }
        .form-panel { max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 12px; background: #B3DEB6; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #e65100; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
        input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .checkbox-list { background: #fafafa; padding: 15px; border: 1px solid #ddd; border-radius: 6px; max-height: 200px; overflow-y: auto; }
        .btn-submit { background: #e65100; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-cancel { color: #666; text-decoration: none; margin-left: 15px; }
    </style>
</head>
<body>

<div class="form-panel">
    <h2>🛠️ Manually Build a Squad</h2>
    <p>Select a hole, assign a Captain, and choose which active players belong to this group.</p>
    <hr style="border:0; border-top: 1px solid #eee; margin-bottom: 20px;">

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">

            {{ form.squad_number }}
        </div>

        <div class="form-group">
            <label>Starting Hole:</label>
            {{ form.starting_hole }}
        </div>

        <div class="form-group">
            <label>Designated ScoreKeeper:</label>
            {{ form.scorekeeper }}
        </div>

        <div class="form-group">
            <label>Select Players (Playing Today Only):</label>
            <div class="checkbox-list">
                {{ form.players }}
            </div>
        </div>

        <div style="margin-top: 30px;">
            <button type="submit" class="btn-submit">Save Custom Squad</button>
            <a href="{% url 'scorecard:admin_dashboard' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
